<!-- CSP: nada inline (nem <script>, nem onclick=, nem style=). Script externo só o
     supabase-js do jsDelivr, com SRI (app.js). Imagens: as fotos dos produtos vêm do Storage do Supabase. Conexões: Supabase; links de
     WhatsApp/Maps/Agenda abrem em outra aba e não precisam estar aqui. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://viacep.com.br https://servicodados.ibge.gov.br https://brasilapi.com.br; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>CRM</title>
<meta name="crm-versao" content="4e1315b800c8">
<!-- app no celular (21/10/2026): manifest + sw.js; ícones da instalação em assets/app-*.png -->

<body>
<div id="tela"></div>

<div id="app" class="app" hidden>
  <header class="barra-topo">
    <div class="marca"><img id="logoTopo" src="assets/logo.jpg?v=c886df2fc5" alt="" class="logo"><img id="logoMenu" alt="" class="logo-menu" hidden><div><strong id="nomeTopo">CRM</strong><span>CRM</span></div></div>
    <nav id="menuLateral" class="menu-topo" aria-label="Seções"></nav>
    <span class="flex"></span>
    <button type="button" class="btn-atualizar" data-acao="atualizar-pagina" title="Recarregar a página (os dados e a versão mais nova do sistema)">⟳ Atualizar</button>
    <p class="assinatura">Sistemi Dalessi</p>
    <button type="button" id="usuarioTopo" class="usuario-topo" data-acao="menu-usuario"></button>
  </header>
  <div class="principal">
    <header class="topo">
      <nav id="menuArea" class="menu-area" aria-label="Telas desta área"></nav>
      <div class="busca">
        <input type="search" id="buscaGlobal" placeholder="Buscar empresa, pessoa, telefone, e-mail, negócio, nº da proposta…  (Ctrl+K)" autocomplete="off" aria-label="Busca">
        <div id="resultadosBusca" class="resultados-busca" hidden></div>
      </div>
      <select id="visao" aria-label="Carteira" title="Ver a equipe toda ou a carteira de um vendedor" hidden></select>
      <button type="button" class="btn ouro" data-acao="novo-menu">+ Novo</button>
      <button type="button" id="sino" class="sino" data-acao="sino" aria-label="Alertas"></button>
    </header>
    <div id="faixaModo" class="faixa" hidden>Modo local: os dados ficam só neste navegador. Para a equipe usar de qualquer computador, ligue o Supabase (crm/README.md).</div>
    <div id="faixaCarga" class="faixa" role="status" hidden></div>
    <div id="faixaVersao" class="faixa" role="status" hidden></div>
    <div id="faixaVigia" class="faixa alerta" role="alert" hidden></div>
    <main id="conteudo" class="conteudo"></main>
  </div>
</div>
